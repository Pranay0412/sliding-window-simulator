<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    @media (prefers-color-scheme: light) {
      .bg { fill: #0f172a; }
      .bracket { stroke: #2563eb; }
      .pkt-acked { fill: #10b981; }
      .pkt-active { fill: #3b82f6; }
      .pkt-next { fill: #cbd5e1; opacity: 0.4; }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #090d16; }
      .bracket { stroke: #38bdf8; }
      .pkt-acked { fill: #34d399; }
      .pkt-active { fill: #38bdf8; }
      .pkt-next { fill: #334155; opacity: 0.5; }
    }
  </style>

  <!-- Background tile with subtle border for contrast on both dark and light tab bars -->
  <rect width="32" height="32" rx="7" class="bg" />

  <!-- Sliding Window Bracket Frame -->
  <rect x="4" y="6" width="24" height="20" rx="3.5" class="bracket" stroke-width="1.8" />

  <!-- Three Protocol Data Units: [ACKed / Base] [Active Flight] [Next Expected] -->
  <rect x="7" y="10" width="5" height="12" rx="1.5" class="pkt-acked" />
  <rect x="13.5" y="10" width="5" height="12" rx="1.5" class="pkt-active" />
  <rect x="20" y="10" width="5" height="12" rx="1.5" class="pkt-next" />
</svg>